<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FuelAI Setup</title>

  <link
    rel="stylesheet"
    href="/public/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <p class="range-label">
        FuelAI
      </p>

      <h1>
        Setup
      </h1>

      <p class="sub">
        Give FuelAI a little context before your scan.
      </p>

      <div class="setup-toggles">

        <button
          id="langToggle"
          class="mini-toggle"
          type="button"
        >
          Español
        </button>

        <button
          id="themeToggle"
          class="mini-toggle"
          type="button"
        >
          Night
        </button>

      </div>

      <input
        id="nicknameInput"
        class="goal-select"
        type="text"
        placeholder="Nickname (optional)"
      />

      <input
        id="heightInput"
        class="goal-select"
        type="text"
        placeholder="Height — example: 5'10"
      />

      <input
        id="weightInput"
        class="goal-select"
        type="text"
        placeholder="Current weight — example: 165 lbs"
      />

      <input
        id="targetWeightInput"
        class="goal-select"
        type="text"
        placeholder="Target weight — optional"
      />

      <select id="ageRange" class="goal-select">
        <option value="13-18">Ages 13–18</option>
        <option value="19-30">Ages 19–30</option>
        <option value="31-45">Ages 31–45</option>
        <option value="46-60">Ages 46–60</option>
        <option value="60+">Ages 60+</option>
      </select>

      <select id="genderType" class="goal-select">
        <option value="">Body type</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <select id="activityLevel" class="goal-select">
        <option value="low">Activity / Training Level</option>
        <option value="0-1">0–1 days per week</option>
        <option value="2-3">2–3 days per week</option>
        <option value="4-5">4–5 days per week</option>
        <option value="6plus">6+ days per week</option>
      </select>

      <select id="goalSelect" class="goal-select">
        <option value="fuelwise">
          FuelWise — Maintain / Balance
        </option>

        <option value="cutwise">
          CutWise — Lean Out
        </option>

        <option value="gainwise">
          GainWise — Build / Recover
        </option>
      </select>

      <select id="wiseFlavor" class="goal-select">

        <option value="sweetspot" selected>
          Sweet Spot — Calm + Balanced
        </option>

        <option value="mafia">
          Mafia — Funny Movie Flavor
        </option>

        <option value="toughguy">
          Tough Guy — Direct Coach Energy
        </option>

        <option value="internet">
          Internet — Meme / Teen Slang
        </option>

      </select>

      <section class="range-card">

        <p class="range-label">
          Suggested Guidance
        </p>

        <p
          id="rangeOutput"
          class="range-output"
        >
          Enter height and weight
        </p>

        <p class="range-note">
          General guidance only. Not medical advice.
        </p>

      </section>

      <button
        id="saveSetupBtn"
        class="start-btn"
        type="button"
      >
        Continue to Hub
      </button>

    </section>

  </main>

  <footer class="app-footer">

    <p>
      FuelAI • Less overthinking. Better decisions.
    </p>

  </footer>

  <script src="/public/assets/js/auth-soft.js"></script>

  <script>
    window.FuelAIAuth?.requireSoftLogin();
  </script>

  <script src="/public/assets/js/setup.js?v=4"></script>

</body>
</html>
