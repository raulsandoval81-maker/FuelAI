<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Welcome — FuelAI</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <h1>FuelAI</h1>

      <p class="sub">
        Less overthinking. Better food decisions.
      </p>

      <section class="range-card">

        <p class="range-label">
          🍽 MealWise
        </p>

        <p class="hero-note">
          Scan meals, hydration, and recovery.
        </p>

        <p class="range-label">
          🧊 FridgeWise
        </p>

        <p class="hero-note">
          Get simple meal ideas from food you already have.
        </p>

        <p class="range-label">
          🎯 TrackWise
        </p>

        <p class="hero-note">
          Build consistency with quick daily check-ins.
        </p>

      </section>

      <div class="wise-links">

        <input
          id="emailInput"
          class="goal-select"
          type="email"
          placeholder="Enter your email"
        />

        <button
          id="continueBtn"
          class="start-btn"
          type="button"
        >
          Continue
        </button>

      </div>

      <p class="hero-note">
        New here? We’ll help you get set up in under 2 minutes.
      </p>

    </section>

  </main>

<script src="/assets/js/core/auth-soft.js"></script>

<script>

const continueBtn =
  document.getElementById("continueBtn");

const emailInput =
  document.getElementById("emailInput");

continueBtn?.addEventListener(
  "click",
  () => {

    const email =
      emailInput.value.trim();

    if (!email.includes("@")) return;

    window.FuelAIAuth.softLogin(email);

    window.location.href =
      "/index.html";

  }
);

emailInput.addEventListener(
  "keydown",
  (e) => {

    if (e.key === "Enter") {
      continueBtn.click();
    }

  }
);

</script>
</body>
</html>
