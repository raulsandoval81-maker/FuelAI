<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Welcome — FuelAI</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <h1>FuelAI</h1>

      <p class="sub">
        Less overthinking. Better food decisions.
      </p>

      <div class="wise-links">

        <input
          id="emailInput"
          class="goal-select"
          type="email"
          placeholder="Enter your email"
        />

        <button
          id="continueBtn"
          class="start-btn"
          type="button"
        >
          Continue
        </button>

      </div>

      <p class="hero-note">
        New here? We’ll help you get set up.
      </p>

    </section>

  </main>

<script src="/assets/js/auth-soft.js"></script>

<script>

const continueBtn =
  document.getElementById("continueBtn");

const emailInput =
  document.getElementById("emailInput");

continueBtn?.addEventListener(
  "click",
  () => {

    const email =
      emailInput.value.trim();

    if (!email.includes("@")) return;

    window.FuelAIAuth.softLogin(email);

    window.location.href =
      "/index.html";

  }
);

emailInput.addEventListener(
  "keydown",
  (e) => {

    if (e.key === "Enter") {
      continueBtn.click();
    }

  }
);

</script>
</body>
</html>
