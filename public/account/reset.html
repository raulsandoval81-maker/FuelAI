<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Reset</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <p class="range-label">
        FuelAI
      </p>

      <h1>Reset</h1>

      <p class="sub">
        Clear the noise. Simplify the next move.
      </p>

      <textarea
        id="resetInput"
        class="goal-select"
        placeholder="What’s piling up right now?"
        rows="6"
      ></textarea>

      <button
        id="resetBtn"
        class="start-btn"
        type="button"
      >
        Reset Me
      </button>

      <section
        id="loadingCard"
        class="range-card hidden"
      >
        <p class="range-label">
          Resetting...
        </p>

        <p class="range-output">
          Slowing the spiral down.
        </p>
      </section>

      <section
        id="resetOutput"
        class="range-card hidden"
      >

        <p class="range-label">
          Reorient
        </p>

        <p
          id="resetResponse"
          class="range-output"
        >
          One thing at a time.
        </p>

      </section>

      <div class="wise-links">

        <a
          class="secondary-btn"
          href="/account/profile.html"
        >
          Back to Account
        </a>


      </div>

    </section>

  </main>

  <footer class="app-footer">

    <p>
      FuelAI • Less overthinking. Better decisions.
    </p>

  </footer>

  <script src="/assets/js/auth-soft.js"></script>

  <script>
    window.FuelAIAuth?.requireSoftLogin();

    const resetBtn =
      document.getElementById("resetBtn");

    const resetOutput =
      document.getElementById("resetOutput");

    const resetResponse =
      document.getElementById("resetResponse");

    const loadingCard =
      document.getElementById("loadingCard");

    const resetInput =
      document.getElementById("resetInput");

    resetBtn.onclick = async () => {

      const value =
        resetInput.value.trim();

      if (!value) return;

      loadingCard.classList.remove("hidden");
      resetOutput.classList.add("hidden");
      resetBtn.disabled = true;

      await new Promise(resolve =>
        setTimeout(resolve, 1200)
      );

      let response =
        "Pause the spiral. Pick one grounded next step and move.";

      const lower =
        value.toLowerCase();

      if (
        lower.includes("food") ||
        lower.includes("diet") ||
        lower.includes("weight")
      ) {

        response =
          "Don’t fix the whole week. Fix the next meal.";

      } else if (
        lower.includes("money") ||
        lower.includes("bills")
      ) {

        response =
          "Stabilize first. One bill. One call. One move.";

      } else if (
        lower.includes("stress") ||
        lower.includes("overwhelmed")
      ) {

        response =
          "Your brain is stacking everything equally. It’s lying. Pick the smallest useful move.";

      } else if (
        lower.includes("sleep")
      ) {

        response =
          "Tonight matters more than tomorrow’s perfect plan.";

      }

      resetResponse.textContent =
        response;

      loadingCard.classList.add("hidden");
      resetOutput.classList.remove("hidden");
      resetBtn.disabled = false;

    };
  </script>

</body>
</html>
