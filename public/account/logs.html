<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="icon" href="data:," />

  <title>FuelAI Log</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <p class="range-label">
        ACCOUNT
      </p>

      <h1>
        📋 FuelAI Log
      </h1>

      <p class="sub">
        Review your recent habits, progress, and available history.
      </p>

      <section class="range-card">

        <p class="range-label">
          Today Snapshot
        </p>

        <p
          id="todaySnapshot"
          class="range-output"
        >
          Loading today...
        </p>

      </section>

      <section class="range-card">

        <p class="range-label">
          Recent History
        </p>

        <p class="range-note">
          Your quick recent view.
        </p>

        <div id="logsContainer">
          Loading logs...
        </div>

      </section>

      <section class="range-card">

        <p class="range-label">
          Log History
        </p>

        <p class="range-output">
          Your available history depends on your FuelAI plan.
        </p>

        <button
          id="toggleFullHistoryBtn"
          class="secondary-btn"
          type="button"
        >
          Loading Log History...
        </button>

        <div
          id="fullHistoryContainer"
          class="history-stack hidden"
        ></div>

      </section>

      <div class="wise-links">

        <a
          class="secondary-btn"
          href="/hub/"
        >
          🏠 Return to Hub
        </a>

      </div>

      <p class="hero-note">
        FuelAI • Awareness without obsession.
      </p>

    </section>

  </main>

  <script src="/assets/js/core/auth-soft.js"></script>

  <script>
    window.FuelAIAuth?.requireSoftLogin();
  </script>

  <script src="/assets/js/core/preferences.js"></script>
  <script src="/assets/js/core/plan.js"></script>
  <script src="/assets/js/account/fuelai-log.js"></script>
  <script src="/assets/js/logs.js?v=2"></script>

</body>
</html>
