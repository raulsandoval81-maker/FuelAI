<!DOCTYPE html>
<html lang="en">
<head>

    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Advanced Macro Tracking</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <h1>Advanced Macro Tracking</h1>

      <p class="sub">
        Optional deeper nutrition tracking.
      </p>

      <section class="range-card">

        <p class="range-label">
          Daily Targets
        </p>

        <p
          id="macroTargets"
          class="range-output"
        >
          Loading...
        </p>

      </section>

      <section class="range-card">

        <p class="range-label">
          Today's Progress
        </p>

        <p
          id="macroProgress"
          class="range-output"
        >
          Loading...
        </p>

      </section>

      <div class="profile-links">

        <a
          class="secondary-btn"
          href="/profile.html"
        >
          ↩️ Back to Profile
        </a>

        <a
          class="secondary-btn"
          href="/wise.html"
        >
          🧠 Return to Guide

      </div>

      <p class="hero-note">
        Optional advanced nutrition tracking.
      </p>

    </section>

  </main>
