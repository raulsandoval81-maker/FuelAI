<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login — FuelAI</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="day">

  <main class="scan-wrap">

    <section class="scan-card">

      <h1>FuelAI</h1>

      <p class="sub">
        Welcome back.
      </p>

      <div class="wise-links">

        <input
          class="goal-select"
          type="email"
          placeholder="Email"
        />

        <input
          class="goal-select"
          type="password"
          placeholder="Password"
        />

        <button
          class="start-btn"
          type="button"
        >
          Login
        </button>
        <a
          class="secondary-btn"
          href="/index.html"
        >
        </a>

      </div>

    </section>

  </main>

</body>
</html>
