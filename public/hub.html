<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0"
/>

  <title>FuelAI Hub</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="hub-wrap">


<header class="hub-header">

  <div>

    <h1>
      FuelAI
    </h1>

    <p>
      Less overthinking. Better decisions.
    </p>

  </div>

</header>

<section class="hub-grid">

  <a
    class="hub-card green"
    href="/fuel/app.html"
  >

    <img
      src="/assets/img/hub/mealwise.png"
      alt="MealWise"
    />

    <div class="hub-card-copy">

      <h3>
        MealWise
      </h3>

      <p>
        Scan meals, improve hydration, and recover better.
      </p>

    </div>

  </a>

  <a
    class="hub-card blue"
    href="/food/fridgewise.html"
  >

    <img
      src="/assets/img/hub/fridgewise.png"
      alt="FridgeWise"
    />

    <div class="hub-card-copy">

      <h3>
        FridgeWise
      </h3>

      <p>
        Build meal ideas from what you already have.
      </p>

    </div>

  </a>

  <a
    class="hub-card purple"
    id="trackwiseCard"
    href="/trackwise/index.html"
  >

    <img
      src="/assets/img/hub/stayontrack.png"
      alt="TrackWise"
    />

    <div class="hub-card-copy">

      <h3>
        TrackWise
      </h3>

      <p>
        Track consistency, progress, and daily habits.
      </p>

    </div>

  </a>

  <a
    class="hub-card red"
    id="combatAthleteCard"
    href="/combat-athlete/"
  >

    <img
      src="/assets/img/hub/combat-athlete.png"
      alt="Combat Athlete"
    />

    <div class="hub-card-copy">

      <h3>
        Combat Athlete
      </h3>

      <p>
        WeightWise, competition prep, and athlete readiness tools.
      </p>

    </div>

  </a>

</section>


  </main>

  <script src="/assets/js/core/plan.js"></script>

  <script src="/assets/js/core/auth-soft.js"></script>

<script>
  const plan =
    window.FuelAIPlan?.getFuelAIPlan?.();

  const features =
    window.FuelAIPlan?.getFuelAIFeatures?.();

  const trackwiseCard =
    document.getElementById("trackwiseCard");

  const combatAthleteCard =
    document.getElementById("combatAthleteCard");

  if (features) {

    if (!features.trackwise) {
      trackwiseCard?.remove();
    }

    if (combatAthleteCard) {

      if (plan === "free") {
        combatAthleteCard.remove();
      }

      if (plan === "basic") {
        combatAthleteCard.href = "/upgrade.html";

        const copy =
          combatAthleteCard.querySelector("p");

        if (copy) {
          copy.textContent =
            "Plus feature: WeightWise, competition prep, and athlete readiness tools.";
        }

        const badge =
          document.createElement("span");

        badge.textContent =
          "Unlock Plus";

        combatAthleteCard.appendChild(badge);
      }

    }

  }

  window.FuelAIAuth?.requireSoftLogin();
</script>
</body>
</html>
