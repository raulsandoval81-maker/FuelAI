<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FuelAI Hub</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="hub-wrap">

    <header class="hub-header">

      <div>

        <h1>
          FuelAI
        </h1>

        <p>
          Less overthinking. Better decisions.
        </p>

      </div>

    </header>

    <section class="hub-grid">

      <a
        class="hub-card green"
        href="/fuel/app.html"
      >

        <img
          src="/assets/img/hub/mealwise.png"
          alt="MealWise"
        />

        <div class="hub-card-copy">

          <h3>
            MealWise
          </h3>

          <p>
            Scan meals, improve hydration, and recover better.
          </p>

        </div>

      </a>

      <a
        class="hub-card blue"
        href="/food/fridgewise.html"
      >

        <img
          src="/assets/img/hub/fridgewise.png"
          alt="FridgeWise"
        />

        <div class="hub-card-copy">

          <h3>
            FridgeWise
          </h3>

          <p>
            Build meal ideas from what you already have.
          </p>

        </div>

      </a>

      <a
        class="hub-card purple"
        href="/trackwise/index.html"
      >

        <img
          src="/assets/img/hub/stayontrack.png"
          alt="TrackWise"
        />

        <div class="hub-card-copy">

          <h3>
            TrackWise
          </h3>

          <p>
            Track consistency, progress, and daily habits.
          </p>

        </div>

      </a>

    </section>

  </main>

  <script src="/assets/js/core/auth-soft.js"></script>

  <script>
    window.FuelAIAuth?.requireSoftLogin();
  </script>

</body>
</html>
