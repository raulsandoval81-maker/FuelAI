<script>
  window.FuelAIAuth?.requireSoftLogin();

  const setup =
    JSON.parse(
      localStorage.getItem("fuelai-setup") || "{}"

  const hasSetup =
    Object.keys(setup).length > 0;

    hasSetup
      ? "/hub.html"
      : "/account/setup.html";
