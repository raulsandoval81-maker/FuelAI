<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FuelAI | Powered by Sandman</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />

  <style>
    .landing-wrap{
      min-height:100vh;
      padding:32px 20px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        radial-gradient(
          circle at top,
          #14532d 0,
          #020617 42%
        ),
        #020617;

      color:#fff;
    }

    .landing-card{
      width:100%;
      max-width:1100px;

      padding:36px 24px;

      border:
        1px solid rgba(34,197,94,.28);

      border-radius:32px;

      background:
        rgba(15,23,42,.84);

      box-shadow:
        0 0 44px rgba(34,197,94,.18);

      text-align:center;

      animation:
        cardRise .55s ease-out both;
    }

    .landing-kicker{
      margin:0 0 10px;

      color:#86efac;

      font-size:.78rem;
      font-weight:1000;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    .landing-title{
      margin:0;

      font-size:
        clamp(2.8rem,12vw,4.6rem);

      font-weight:1000;
      line-height:.95;
      letter-spacing:-.06em;
    }

    .landing-title span{
      color:#22c55e;
    }

    .landing-line{
      margin:18px auto 0;

      max-width:540px;

      color:#f1f5f9;

      font-size:1.3rem;
      line-height:1.4;
      font-weight:900;
    }

    .hero-image{
      display:block;

      width:100%;
      max-width:520px;
      height:auto;

      margin:30px auto 24px;

      border-radius:22px;

      filter:
        drop-shadow(
          0 0 40px rgba(34,197,94,.18)
        );

      animation:
        heroFade .7s ease-out both;
    }

    .landing-sub{
      margin:20px auto 0;

      max-width:580px;

      color:#cbd5e1;

      font-size:1.02rem;
      line-height:1.65;
      font-weight:700;
    }

    .landing-system{
      display:grid;

      grid-template-columns:
        repeat(4,minmax(0,1fr));

      gap:10px;

      width:100%;
      max-width:700px;

      margin:26px auto 0;
    }

    .landing-system span{
      min-height:46px;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:10px 12px;

      border-radius:14px;

      border:
        1px solid rgba(255,255,255,.08);

      background:
        rgba(255,255,255,.04);

      color:#d1fae5;

      font-size:.86rem;
      font-weight:900;
    }

    .landing-actions{
      display:grid;
      gap:12px;

      width:100%;
      max-width:520px;

      margin:30px auto 0;
    }

    .landing-btn{
      display:flex;
      align-items:center;
      justify-content:center;

      min-height:58px;

      border-radius:18px;

      text-decoration:none;

      font-weight:1000;
      letter-spacing:.03em;

      transition:
        transform .14s ease,
        box-shadow .14s ease,
        opacity .14s ease;

      -webkit-tap-highlight-color:
        transparent;

      touch-action:
        manipulation;
    }

    .landing-btn.primary{
      background:
        linear-gradient(
          135deg,
          #16a34a,
          #22c55e
        );

      color:#02130a;

      box-shadow:
        0 0 24px rgba(34,197,94,.3);
    }

    .landing-btn.secondary{
      background:
        rgba(255,255,255,.07);

      color:#e5e7eb;

      border:
        1px solid rgba(255,255,255,.12);
    }

    .landing-btn:hover{
      transform:
        translateY(-1px);
    }

    .landing-btn:active{
      transform:
        scale(.975);

      opacity:.92;
    }

    .landing-btn.primary:active{
      box-shadow:
        0 0 14px rgba(34,197,94,.22);
    }

    .sandman-footer{
      margin-top:30px;

      color:#94a3b8;

      font-size:.82rem;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .sandman-footer strong{
      color:#22c55e;
    }

    @keyframes heroFade{
      from{
        opacity:0;

        transform:
          translateY(12px)
          scale(.985);
      }

      to{
        opacity:1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes cardRise{
      from{
        opacity:0;

        transform:
          translateY(18px);
      }

      to{
        opacity:1;

        transform:
          translateY(0);
      }
    }

    @media (max-width:700px){

      .landing-wrap{
        padding:18px 12px;
        align-items:flex-start;
      }

      .landing-card{
        padding:26px 14px;
        border-radius:24px;
      }

      .landing-title{
        font-size:
          clamp(2.5rem,16vw,4rem);
      }

      .landing-line{
        font-size:1.1rem;
      }

      .landing-sub{
        font-size:.96rem;
      }

      .hero-image{
        margin:22px auto 20px;
        border-radius:18px;
      }

      .landing-system{
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

      .landing-btn{
        min-height:60px;
        font-size:1rem;
      }
    }

    @media (
      prefers-reduced-motion:reduce
    ){

      .landing-card,
      .hero-image{
        animation:none;
      }

      .landing-btn{
        transition:none;
      }
    }
  </style>
</head>

<body data-theme="night">

  <main class="landing-wrap">

    <section class="landing-card">

      <p class="landing-kicker">
        Powered by Sandman™
      </p>

      <h1 class="landing-title">
        Fuel<span>AI</span>
      </h1>

      <p class="landing-line">
        Train smarter. Fuel better.<br />
        Recover with purpose.
      </p>

      <img
        class="hero-image"
        src="/assets/img/hero/fuelai-hero-v1.png"
        alt="FuelAI nutrition, hydration, training, and performance platform"
      />

      <p class="landing-sub">
        Food. Hydration. Training. Recovery.<br />
        One connected system built around the way you live and train.
      </p>

      <div class="landing-system">

        <span>
          🍽 Food
        </span>

        <span>
          💧 Hydration
        </span>

        <span>
          💪 Training
        </span>

        <span>
          🌙 Recovery
        </span>

      </div>

      <div class="landing-actions">

        <a
          class="landing-btn primary"
          href="/account/login.html"
        >
          Create Profile →
        </a>

        <a
          class="landing-btn secondary"
          href="/account/login.html"
        >
          Sign In
        </a>

      </div>

      <footer class="sandman-footer">
        FuelAI™ · Powered by
        <strong>Sandman™</strong>
      </footer>

    </section>

  </main>

  <script
    src="/assets/js/core/auth-soft.js"
  ></script>

  <script>
    const isLoggedIn =
      window.FuelAIAuth
        ?.isSoftLoggedIn?.();

    const primaryBtn =
      document.querySelector(
        ".landing-btn.primary"
      );

    const secondaryBtn =
      document.querySelector(
        ".landing-btn.secondary"
      );


    if (
      isLoggedIn &&
      primaryBtn
    ) {
      primaryBtn.textContent =
        "Continue to FuelAI →";

      primaryBtn.href =
        "/hub/";
    }


    if (
      isLoggedIn &&
      secondaryBtn
    ) {
      secondaryBtn.textContent =
        "Edit My Setup";

      secondaryBtn.href =
        "/account/setup.html";
    }
  </script>

</body>
</html>
