<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FuelAI</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="hero">

    <h1>FuelAI</h1>

    <p class="sub">
      Opening your experience...
    </p>

  </main>

  <script src="/assets/js/auth-soft.js"></script>

  <script>
    window.FuelAIAuth.requireSoftLogin();

    const setup =
      JSON.parse(localStorage.getItem("fuelai-setup") || "{}");

    const hasSetup =
      setup.goal &&
      setup.wiseFlavor;

    window.location.href =
      hasSetup
        ? "/wise.html"
        : "/setup.html";
  </script>

</body>
</html>
