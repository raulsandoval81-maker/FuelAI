<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FuelAI</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="hero">

    <h1>FuelAI</h1>

    <p class="sub">
      Loading...
    </p>

  </main>

  <script src="/assets/js/core/auth-soft.js"></script>


<script>
  window.FuelAIAuth?.requireSoftLogin();

  const setup =
    JSON.parse(
      localStorage.getItem("fuelai-setup") || "{}"
    );

  const hasSetup =
    Object.keys(setup).length > 0;

const plan =
  setup.plan || setup.goal || "";

const lifestyleType =
  setup.lifestyleType || "";

const isCombatUser =
  lifestyleType === "combat-athlete";

window.location.href =
  hasSetup
    ? isCombatUser
      ? "/combat-athlete/weightwise/"
      : "/hub.html"
    : "/account/setup.html";

</script>
</body>
</html>
