<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Pantry Companion</title>

  <link rel="stylesheet" href="/pantry-companion.css">
</head>

<body>

<main class="wrap">

  <section class="hero">
    <h1>Pantry Companion</h1>

    <p class="sub">
      Tell us what you usually keep stocked.
      We’ll use it to reduce grocery trips and simplify dinner ideas.
    </p>
  </section>

  <section class="panel">

    <h2>Usually Stocked</h2>

    <div class="grid">

      <label><input type="checkbox" value="rice"> Rice</label>
      <label><input type="checkbox" value="pasta"> Pasta</label>
      <label><input type="checkbox" value="tortillas"> Tortillas</label>
      <label><input type="checkbox" value="bread"> Bread</label>

      <label><input type="checkbox" value="beans"> Beans</label>
      <label><input type="checkbox" value="cheese"> Cheese</label>
      <label><input type="checkbox" value="eggs"> Eggs</label>
      <label><input type="checkbox" value="milk"> Milk</label>

      <label><input type="checkbox" value="soy sauce"> Soy Sauce</label>
      <label><input type="checkbox" value="garlic"> Garlic</label>
      <label><input type="checkbox" value="onions"> Onions</label>
      <label><input type="checkbox" value="butter"> Butter</label>

      <label><input type="checkbox" value="olive oil"> Olive Oil</label>
      <label><input type="checkbox" value="spices"> Basic Spices</label>
      <label><input type="checkbox" value="salsa"> Salsa</label>
      <label><input type="checkbox" value="frozen veggies"> Frozen Veggies</label>

    </div>

    <button id="savePantryBtn">
      Save Pantry Basics
    </button>

    <p id="saveMessage" class="save-message hidden">
      Pantry preferences saved.
    </p>

  </section>

</main>

<script src="/pantry-companion.js"></script>

</body>
</html>
