<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Cabinet Drawer</title>

  <link rel="stylesheet" href="/assets/css/site.css" />
  <link rel="stylesheet" href="/assets/css/cabinet-drawer.css" />
</head>

<body data-theme="day">

  <main class="scan-wrap">

    <section class="scan-card">

      <h1>Cabinet Drawer</h1>

      <p class="sub">
        Save the stuff your household usually has, likes, and needs.
      </p>

      <section class="drawer-section">
        <button class="drawer-toggle" type="button">
          🥫 Pantry Staples
        </button>

        <div class="drawer-panel">
          <div class="drawer-chips" id="pantryStaples">
            <button type="button">Rice</button>
            <button type="button">Pasta</button>
            <button type="button">Beans</button>
            <button type="button">Tortillas</button>
            <button type="button">+ Add Your Own</button>
          </div>
        </div>
      </section>

      <section class="drawer-section">
        <button class="drawer-toggle" type="button">
          ❄️ Freezer Items
        </button>

        <div class="drawer-panel hidden">
          <div class="drawer-chips" id="freezerItems">
            <button type="button">Frozen Chicken</button>
            <button type="button">Ground Beef</button>
            <button type="button">Frozen Veggies</button>
            <button type="button">Pizza</button>
            <button type="button">+ Add Your Own</button>
          </div>
        </div>
      </section>

      <section class="drawer-section">
        <button class="drawer-toggle" type="button">
          ⭐ Favorites
        </button>

        <div class="drawer-panel hidden">
          <div class="drawer-chips" id="favorites">
            <button type="button">Quesadillas</button>
            <button type="button">Rice Bowls</button>
            <button type="button">Protein Snacks</button>
            <button type="button">Sandwiches</button>
            <button type="button">+ Add Your Own</button>
          </div>
        </div>
      </section>

      <section class="drawer-section">
        <button class="drawer-toggle" type="button">
          🛒 Grocery List
        </button>

        <div class="drawer-panel hidden">
          <textarea
            id="groceryList"
            class="goal-select"
            placeholder="Add groceries you need..."
            rows="3"
          ></textarea>
        </div>
      </section>

      <section class="drawer-section">
        <button class="drawer-toggle" type="button">
          ⚡ Meal Preferences
        </button>

        <div class="drawer-panel hidden">
          <div class="drawer-chips" id="mealModes">
            <button type="button">⚡ Ultra Fast</button>
            <button type="button">👨‍👩‍👧 Family</button>
            <button type="button">💪 Protein-Heavy</button>
            <button type="button">♻️ Leftovers First</button>
            <button type="button">Low Cleanup</button>
            <button type="button">Budget Friendly</button>
          </div>
        </div>
      </section>

      <p class="range-note">
        Enough structure to help. Not so much it becomes work.
      </p>

      <div class="wise-links">

        <a
          class="secondary-btn"
          href="/fridgewise.html"
        >
          🧊 Back to FridgeWise
        </a>

      </div>

    </section>

  </main>

  <script src="/assets/js/preferences.js"></script>
  <script src="/assets/js/fridgewise/cabinet-drawer.js"></script>

</body>
</html>
