<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Cabinet Drawer</title>

  <link rel="stylesheet" href="/assets/css/site.css" />
  <link rel="stylesheet" href="/assets/css/cabinet-drawer.css" />
</head>

<body data-theme="day">

  <main class="scan-wrap">

    <section class="scan-card">

      <h1>Cabinet Drawer</h1>

      <p class="sub">
        Save what your household usually has, likes, and needs.
      </p>

      <section class="drawer-section">
        <button
          class="drawer-toggle"
          type="button"
          data-drawer="pantry"
        >
          🥫 Pantry Staples
        </button>

        <div
          id="drawer-pantry"
          class="drawer-panel hidden"
        >
          <ul
            id="pantryList"
            class="drawer-list"
          ></ul>

          <div class="drawer-add-row">
            <input
              id="pantryInput"
              type="text"
              placeholder="Add pantry item..."
            />

            <button
              type="button"
              data-add="pantry"
            >
              Add
            </button>
          </div>
        </div>
      </section>

      <section class="drawer-section">
        <button
          class="drawer-toggle"
          type="button"
          data-drawer="freezer"
        >
          ❄️ Freezer Items
        </button>

        <div
          id="drawer-freezer"
          class="drawer-panel hidden"
        >
          <ul
            id="freezerList"
            class="drawer-list"
          ></ul>

          <div class="drawer-add-row">
            <input
              id="freezerInput"
              type="text"
              placeholder="Add freezer item..."
            />

            <button
              type="button"
              data-add="freezer"
            >
              Add
            </button>
          </div>
        </div>
      </section>

      <section class="drawer-section">
        <button
          class="drawer-toggle"
          type="button"
          data-drawer="favorites"
        >
          ⭐ Favorites
        </button>

        <div
          id="drawer-favorites"
          class="drawer-panel hidden"
        >
          <ul
            id="favoritesList"
            class="drawer-list"
          ></ul>

          <div class="drawer-add-row">
            <input
              id="favoritesInput"
              type="text"
              placeholder="Add favorite meal..."
            />

            <button
              type="button"
              data-add="favorites"
            >
              Add
            </button>
          </div>
        </div>
      </section>

      <section class="drawer-section">
        <button
          class="drawer-toggle"
          type="button"
          data-drawer="grocery"
        >
          🛒 Grocery List
        </button>

        <div
          id="drawer-grocery"
          class="drawer-panel hidden"
        >
          <ul
            id="groceryList"
            class="drawer-list"
          ></ul>

          <div class="drawer-add-row">
            <input
              id="groceryInput"
              type="text"
              placeholder="Add grocery item..."
            />

            <button
              type="button"
              data-add="grocery"
            >
              Add
            </button>
          </div>
        </div>
      </section>

      <section class="drawer-section">
        <button
          class="drawer-toggle"
          type="button"
          data-drawer="preferences"
        >
          ⚡ Meal Preferences
        </button>

        <div
          id="drawer-preferences"
          class="drawer-panel hidden"
        >
          <ul
            id="preferencesList"
            class="drawer-list"
          ></ul>

          <div class="drawer-add-row">
            <input
              id="preferencesInput"
              type="text"
              placeholder="Add preference..."
            />

            <button
              type="button"
              data-add="preferences"
            >
              Add
            </button>
          </div>
        </div>
      </section>

      <p class="range-note">
        Enough structure to help. Not so much it becomes work.
      </p>

      <div class="wise-links">

        <a
          class="secondary-btn"
          href="/wise.html"
        >
          ↩️ Return to Guide
        </a>

      </div>

    </section>

  </main>

  <script src="/assets/js/preferences.js"></script>
  <script src="/assets/js/fridgewise/cabinet-drawer.js"></script>

</body>
</html>
