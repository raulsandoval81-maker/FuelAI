<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="icon" href="data:," />

  <title>FridgeWise</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <p class="range-label">
        FuelAI
      </p>

      <h1>
        FridgeWise
      </h1>

      <p class="sub">
        Scan your fridge. Get simple dinner ideas.
      </p>

      <div
        id="fridgeUploadBox"
        class="upload-actions"
      >

        <label class="upload-half">

          <span class="upload-title">
            📸 Take Fridge Photo
          </span>

          <span class="upload-sub">
            Open camera
          </span>

          <input
            id="fridgeInput"
            type="file"
            accept="image/*"
            capture="environment"
          />

        </label>

        <label class="upload-half">

          <span class="upload-title">
            🖼 Upload Fridge Photo
          </span>

          <span class="upload-sub">
            Choose from library
          </span>

          <input
            id="fridgeUploadInput"
            type="file"
            accept="image/*"
          />

        </label>

      </div>

      <textarea
        id="pantryNotes"
        class="goal-select"
        placeholder="Anything important not visible in the photo?"
        rows="3"
      ></textarea>

      <img
        id="fridgePreview"
        class="preview hidden"
        alt="Fridge preview"
      />

      <button
        id="fridgeAnalyzeBtn"
        class="start-btn hidden"
        type="button"
      >
        🧊 Build Dinner Ideas
      </button>

      <div
        id="fridgeLoadingCard"
        class="loading-card hidden"
      >
        <div class="scanner"></div>

        <p id="fridgeLoadingText">
          Checking fridge...
        </p>
      </div>

      <section
        id="fridgeResultCard"
        class="result-card hidden"
      ></section>

      <div class="wise-links">

        <a
          class="secondary-btn"
          href="/food/cabinet-drawer.html"
        >
          🥫 Cabinet Drawer
        </a>

        <a
          class="secondary-btn"
          href="/hub.html"
        >
          🏠 Return to Hub
        </a>

      </div>

      <p class="hero-note">
        FuelAI • Less overthinking. Better decisions.
      </p>

    </section>

  </main>

<script src="/assets/js/core/auth-soft.js"></script>

<script>
  window.FuelAIAuth?.requireSoftLogin();
</script>

<script src="/assets/js/core/preferences.js"></script>
<script src="/assets/js/fridgewise/fridgewise-memory.js"></script>
<script src="/assets/js/fridgewise/fridgewise-page.js?v=9"></script>
</body>
</html>
