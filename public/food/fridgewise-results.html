
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="View simple FridgeWise meal ideas based on the food you already have."
  />

  <link rel="icon" href="data:," />

  <title>Meal Ideas | FridgeWise</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <header class="results-header">

        <p class="range-label">
          FRIDGEWISE
        </p>

        <h1>
          🍽️ Meal Ideas
        </h1>

        <p class="sub">
          Simple meal paths built around what you already have.
        </p>

      </header>

      <section
        class="range-card"
        aria-labelledby="mealIdeasTitle"
      >

        <p
          id="mealIdeasTitle"
          class="range-label"
        >
          Suggested Meals
        </p>

        <p class="range-note">
          FridgeWise uses your saved pantry, freezer, extras, and favorite meals to keep suggestions realistic.
        </p>

        <div
          id="mealsContainer"
          class="result-card"
          aria-live="polite"
          aria-busy="true"
        >
          <p class="range-output">
            Building meal ideas...
          </p>
        </div>

      </section>

      <nav
        class="wise-links"
        aria-label="Meal ideas navigation"
      >

        <a
          class="secondary-btn"
          href="/food/fridgewise.html"
        >
          ← Back to FridgeWise
        </a>

        <a
          class="secondary-btn"
          href="/hub.html"
        >
          🏠 Return to Hub
        </a>

      </nav>

      <footer class="hero-note">
        FuelAI™ • Powered by Sandman™
      </footer>

    </section>

  </main>

  <script src="/assets/js/core/auth-soft.js"></script>

  <script>
    window.FuelAIAuth?.requireSoftLogin();
  </script>

  <script src="/assets/js/core/preferences.js"></script>
  <script src="/assets/js/fridgewise/fridgewise-memory.js"></script>
  <script src="/assets/js/fridgewise/fridgewise-results.js"></script>

</body>
</html>
