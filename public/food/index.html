<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>What Can I Eat?</title>

  <link
    rel="stylesheet"
    href="/public/assets/css/site.css"
  />

  <link
    rel="stylesheet"
    href="/public/assets/css/hub-screen.css"
  />

</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <p class="range-label">
        FUELAI
      </p>

      <h1>
        🧊 What Can I Eat?
      </h1>

      <p class="sub">
        Use your fridge, cabinet, or ingredient scan
        to simplify the next food decision.
      </p>

      <div class="hub-screen food-map">

        <img
          class="hub-screen-img"
          src="/public/assets/img/hub/what-can-i-eat2.png"
          alt="Food House"
        />

        <a
          class="hub-hotspot one"
          href="/public/food/fridgewise.html"
          aria-label="FridgeWise"
        ></a>

        <a
          class="hub-hotspot two"
          href="/public/food/cabinet-drawer.html"
          aria-label="Cabinet Drawer"
        ></a>

        <a
          class="hub-hotspot three"
          href="/public/food/ingredient-scan.html"
          aria-label="Scan Ingredients"
        ></a>

        <a
          class="hub-hotspot four"
          href="/public/hub.html"
          aria-label="Return to Hub"
        ></a>

      </div>

      <p class="hero-note">
        FuelAI • Less overthinking. Better decisions.
      </p>

    </section>

  </main>

  <footer class="app-footer">

    <p>
      FuelAI • Food discovery and meal ideas.
    </p>

  </footer>

</body>
</html>
