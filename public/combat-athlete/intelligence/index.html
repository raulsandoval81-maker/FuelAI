<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0"
/>

  <title>Combat Athlete Intelligence | FuelAI</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />

  <link
    rel="stylesheet"
    href="./intelligence.css"
  />
</head>

<body data-theme="night">

  <main class="scan-wrap">


<section class="scan-card">

  <p class="range-label">
    FuelAI
  </p>

  <h1>
    🧠 Combat Athlete Intelligence
  </h1>

  <p class="sub">
    Interpret WeightWise data and competition readiness.
  </p>

  <div class="note-box">
    Weight. Fuel. Hydration. Recovery. Competition. Performance.
  </div>

  <section class="output-card">

    <h2>
      Current Status
    </h2>

    <div id="statusOutput">
      Loading...
    </div>

  </section>

  <section class="output-card">

    <h2>
      Ask A Question
    </h2>

    <textarea
      id="questionInput"
      rows="4"
      placeholder="Am I on track?"
    ></textarea>

    <button
      id="analyzeBtn"
      class="btn btn-primary"
    >
      Ask Intelligence
    </button>

  </section>

  <section class="output-card">

    <textarea
      id="answerOutput"
      rows="6"
      placeholder="Answer appears here."
      readonly
    ></textarea>

    <h2>
      Response
    </h2>

  </section>

  <nav class="room-links">

    <a
      class="btn btn-primary"
      href="/combat-athlete/"
    >
      ← Combat Athlete
    </a>

  </nav>

</section>


  </main>

  <script src="./intelligence.js"></script>

</body>
</html>
