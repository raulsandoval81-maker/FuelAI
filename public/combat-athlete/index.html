<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0"
/>

  <title>Combat Athlete | FuelAI</title>

  <link
    rel="stylesheet"
    href="../assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="scan-wrap">


<section class="scan-card">

  <h1>
    Combat Athlete
  </h1>

  <p class="sub">
    Loading your athlete tools...
  </p>

</section>


  </main>

  <script>

    const setup =
      JSON.parse(
        localStorage.getItem(
          "fuelai-setup"
        ) || "{}"
      );

    const membership =
      setup.membership ||
      "free";

    const lifestyleType =
      setup.lifestyleType ||
      "";

    if (
      lifestyleType !==
      "combat-athlete"
    ) {

      window.location.replace(
        "/hub.html"
      );
    }

    if (
      membership ===
      "plus"
    ) {

      window.location.replace(
        "/combat-athlete/weightwise/"
      );
    }

if (
  membership ===
  "standard"
) {

  window.location.replace(
    "/upgrade.html"
  );
}
    if (
      membership ===
      "free"
    ) {

      window.location.replace(
        "/upgrade.html"
      );
    }

  </script>

</body>
</html>
