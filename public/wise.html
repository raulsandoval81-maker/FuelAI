<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wise Guide</title>

  <link rel="stylesheet" href="/assets/css/site.css" />
</head>

<body data-theme="day">
  <main class="scan-wrap">

    <section class="scan-card">

      <h1 id="wiseTitle">WiseGuy</h1>

      <p id="wiseSub" class="sub">
        Your daily food, water, and training check-in.
      </p>

      <section class="range-card">
        <p class="range-label">Current Plan</p>
        <p id="planOutput" class="range-output">Loading...</p>
      </section>

      <section class="range-card">
        <p class="range-label">Today</p>
        <p id="todayOutput" class="range-output">Loading...</p>
      </section>

      <div class="quick-log-grid">

        <button class="start-btn" id="addWaterBtn" type="button">
          + 8 oz Water
        </button>

        <button class="start-btn" id="addTrainingBtn" type="button">
          + Training Logged
        </button>

        <button class="start-btn" id="addWeightBtn" type="button">
          + Dayly Weight Log
        </button>

      </div>

      <section class="range-card">
        <p class="range-label">Wise Check</p>

        <p id="wiseAdvice" class="range-output">
          Loading guidance...
        </p>
      </section>

<p class="range-label" id="wiseChatLabel">
  WiseGuy_AI
</p>
        <textarea
          id="wiseChatInput"
          class="goal-select"
          placeholder="Ask WiseGuyAI something..."
          rows="4"
        ></textarea>

        <button class="start-btn" id="sendWiseChatBtn" type="button">
          Ask
        </button>

        <p id="wiseChatReply" class="range-output">
          Your guide is listening.
        </p>
      </section>

      <div class="wise-links">

        <a class="secondary-btn" href="/app.html">
          Scan Meal
        </a>

        <a class="secondary-btn" href="/fridge.html">
          Open FridgeWise
        </a>

        <a class="secondary-btn" href="/logs.html">
          View 90-Day Log
        </a>

        <a class="secondary-btn" href="/setup.html">
          Edit Setup
        </a>

      </div>

      <p class="hero-note">
        FuelAI • Less overthinking. Better decisions.
      </p>

    </section>
  </main>

  <script src="/assets/js/preferences.js"></script>
  <script src="/assets/js/fuelai-log.js"></script>
  <script src="/assets/js/wise.js"></script>
</body>
</html>
