<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FuelAI Setup</title>

  <link rel="stylesheet" href="/assets/css/site.css" />
</head>

<body>
  <main class="scan-wrap">

    <a class="top-link" href="/">
      ← Start
    </a>

    <section class="scan-card">

      <h1>Setup</h1>

      <p class="sub">
        Give FuelAI a little context before your scan.
      </p>

      <div class="setup-toggles">
        <button id="langToggle" class="mini-toggle" type="button">
          Español
        </button>

        <button id="themeToggle" class="mini-toggle" type="button">
          Night
        </button>
      </div>
      

      <input
       id="nicknameInput"
       class="goal-select"
       type="text"
       placeholder="Nickname (optional)"
      />


      <input
        id="heightInput"
        class="goal-select"
        type="text"
        placeholder="Height — example: 5'10"
      />

      <input
        id="weightInput"
        class="goal-select"
        type="text"
        placeholder="Current weight — example: 165 lbs"
      />

      <input
        id="targetWeightInput"
        class="goal-select"
        type="text"
        placeholder="Target weight — optional"
      />

      <select id="ageRange" class="goal-select">
  <option value="13-18">Ages 13–18</option>
  <option value="19-30">Ages 19–30</option>
  <option value="31-45">Ages 31–45</option>
  <option value="46-60">Ages 46–60</option>
  <option value="60+">Ages 60+</option>
</select>

<select id="genderType" class="goal-select">
  <option value="">Body type</option>
  <option value="male">Male</option>
  <option value="female">Female</option>
</select>

<select id="activityLevel" class="goal-select">
  <option value="low">
    Activity / Training Level
  </option>

  <option value="0-1">
    0–1 days per week
  </option>

  <option value="2-3">
    2–3 days per week
  </option>

  <option value="4-5">
    4–5 days per week
  </option>

  <option value="6plus">
    6+ days per week
  </option>
</select>

      <select id="goalSelect" class="goal-select">
        <option value="fuelwise">FuelWise — Maintain / Balance</option>
        <option value="cutwise">CutWise — Lean Out</option>
        <option value="gainwise">GainWise — Build / Recover</option>
      </select>

      <section class="range-card">
        <p class="range-label">
          Suggested Guidance
        </p>

        <p id="rangeOutput" class="range-output">
          Enter height and weight
        </p>

        <p class="range-note">
          General guidance only. Not medical advice.
        </p>
      </section>

      <button id="saveSetupBtn" class="start-btn">
         Continue to Your Guide
      </button>

    </section>
  </main>

  <script src="/assets/js/setup.js"></script>
</body>
</html>
