<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FuelWise AI Scanner</title>
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
  <main class="scan-wrap">
    <a class="top-link" href="/setup.html">
  Setup
</a>

    <section class="scan-card">
      <h1>FuelWise Scanner</h1>
      <p class="sub">Scan meals. Make smarter athlete nutrition decisions.</p>

<label class="upload-box">

  <span class="upload-title">
    Open Camera
  </span>

  <span class="upload-sub">
    Take a meal photo or choose from library
  </span>

  <input
    id="foodInput"
    type="file"
    accept="image/*"
    capture="environment"
  />

</label>

      <img id="previewImage" class="preview hidden" alt="Food preview" />

      <button id="analyzeBtn" class="start-btn hidden">Analyze Meal</button>

      <div id="loadingCard" class="loading-card hidden">
        <div class="scanner"></div>
        <p id="loadingText">loading...</p>
      </div>

      <section id="resultCard" class="result-card hidden"></section>

<a class="start-btn" href="/profile.html">
  Progress
</a>
    </section>
  </main>

  <script src="/assets/js/app.js"></script>
</body>
</html>
