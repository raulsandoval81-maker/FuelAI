<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FridgeWise</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="day">

  <main class="scan-wrap">

    <section class="scan-card">

      <h1>FridgeWise</h1>

      <p class="sub">
        Scan your fridge. Get simple dinner ideas.
      </p>

      <div
        id="fridgeUploadBox"
        class="upload-actions"
      >

        <label class="upload-half">

          <span class="upload-title">
            📸 Take Fridge Photo
          </span>

          <span class="upload-sub">
            Open camera
          </span>

          <input
            id="fridgeInput"
            type="file"
            accept="image/*"
            capture="environment"
          />

        </label>

        <label class="upload-half">

          <span class="upload-title">
            🖼 Upload Fridge Photo
          </span>

          <span class="upload-sub">
            Choose from library
          </span>

          <input
            id="fridgeUploadInput"
            type="file"
            accept="image/*"
          />

        </label>

      </div>

      <textarea
        id="pantryNotes"
        class="goal-select"
        placeholder="Anything not visible? Pantry, freezer, rice, pasta, spices..."
        rows="3"
      ></textarea>

      <img
        id="fridgePreview"
        class="preview hidden"
        alt="Fridge preview"
      />

      <button
        id="fridgeAnalyzeBtn"
        class="start-btn hidden"
        type="button"
      >
        🧊 Build Dinner Ideas
      </button>

      <div
        id="fridgeLoadingCard"
        class="loading-card hidden"
      >
        <div class="scanner"></div>

        <p id="fridgeLoadingText">
          Checking fridge...
        </p>
      </div>

      <section
        id="fridgeResultCard"
        class="result-card hidden"
      ></section>

      <div class="wise-links">

        <a
          class="secondary-btn"
          href="/fridgewise-results.html"
        >
          🍽️ Open Dinner Ideas
        </a>

      </div>

      <section class="pantry-companion">

        <button
          id="pantryToggle"
          class="secondary-btn pantry-btn"
          type="button"
          aria-expanded="false"
          aria-controls="pantryPanel"
        >
          🥫 Pantry Companion
        </button>

        <div
          id="pantryPanel"
          class="pantry-panel hidden"
        >

          <p class="pantry-copy">
            Tap what you usually have.
            Add anything else below.
          </p>

          <div
            id="pantryChips"
            class="pantry-chips"
          >

            <button type="button" data-item="Rice">Rice</button>
            <button type="button" data-item="Pasta">Pasta</button>
            <button type="button" data-item="Bread">Bread</button>
            <button type="button" data-item="Tortillas">Tortillas</button>
            <button type="button" data-item="Beans">Beans</button>
            <button type="button" data-item="Eggs">Eggs</button>
            <button type="button" data-item="Cheese">Cheese</button>
            <button type="button" data-item="Potatoes">Potatoes</button>
            <button type="button" data-item="Frozen Chicken">Frozen Chicken</button>
            <button type="button" data-item="Ground Beef">Ground Beef</button>
            <button type="button" data-item="Tuna">Tuna</button>
            <button type="button" data-item="Oil">Oil</button>
            <button type="button" data-item="Spices">Spices</button>

          </div>

          <div class="pantry-add-row">

            <input
              id="pantryInput"
              type="text"
              placeholder="Add pantry item..."
            />

            <button
              id="addPantryItem"
              type="button"
            >
              Add
            </button>

          </div>

        </div>

      </section>

      <div class="wise-links">

        <a
          class="secondary-btn"
          href="/wise.html"
        >
          ↩️ Return to Guide
        </a>

      </div>

    </section>

  </main>

  <script src="/assets/js/preferences.js"></script>

<script src="/assets/js/fridgewise/fridgewise-page.js?v=5"></script>

</body>
</html>
