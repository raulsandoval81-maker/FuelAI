<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="icon" href="data:," />

  <title>MealWise Example | FuelAI</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#030712;
      color:#f8fafc;
    }

    .example-shell{
      width:100%;
      max-width:900px;
      margin:0 auto;
      padding:28px 18px 42px;
      text-align:center;
    }

    .example-card{
      padding:22px;

      border-radius:24px;

      border:
        1px solid rgba(34,197,94,.22);

      background:
        linear-gradient(
          180deg,
          rgba(15,23,42,.96),
          rgba(7,16,25,.98)
        );

      box-shadow:
        0 18px 50px rgba(0,0,0,.26);
    }

    .example-card h1{
      margin:8px 0 0;

      font-size:
        clamp(2rem,6vw,3.2rem);
    }

    .example-copy{
      max-width:620px;
      margin:12px auto 0;

      color:#cbd5e1;

      line-height:1.55;
    }

    .example-image{
      display:block;

      width:100%;
      max-width:720px;
      height:auto;

      margin:22px auto 0;

      border-radius:18px;

      border:
        1px solid rgba(255,255,255,.10);

      box-shadow:
        0 18px 40px rgba(0,0,0,.30);
    }

    .example-note{
      max-width:620px;
      margin:14px auto 0;

      color:#94a3b8;

      font-size:.86rem;
      line-height:1.5;
    }

    .example-actions{
      display:flex;
      justify-content:center;

      margin-top:22px;
    }

    .example-actions .secondary-btn{
      width:min(100%,360px);
      text-decoration:none;
    }

    @media(max-width:640px){
      .example-shell{
        padding:18px 12px 30px;
      }

      .example-card{
        padding:16px;
        border-radius:20px;
      }
    }
  </style>
</head>

<body data-theme="night">

  <main class="example-shell">

    <section class="example-card">

      <p class="range-label">
        FuelAI · MealWise
      </p>

      <h1>
        🍽 What MealWise Finds
      </h1>

      <p class="example-copy">
        MealWise estimates calories, protein,
        carbohydrates, and fats, then turns
        the scan into a simple FuelAI read.
      </p>

      <img
        class="example-image"
        src="/assets/img/mealwise/mealwise-scan-example.png"
        alt="Example MealWise scan showing calories, protein, carbohydrates, fats, and FuelAI guidance"
      />

      <p class="example-note">
        Example shown. Actual results depend on
        the meal, portion visibility, and the
        information available in the photo.
      </p>

      <div class="example-actions">

        <a
          class="secondary-btn"
          href="/tools/mealwise/app.html"
        >
          ← Back to MealWise
        </a>

      </div>

    </section>

  </main>

</body>
</html>
