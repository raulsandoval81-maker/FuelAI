<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>TrackWise | FuelAI</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />

  <style>
    .upgrade-card{
      text-align:center;
    }

    .plan-card{
      margin-top:24px;
      padding:24px 20px;
      border:1px solid rgba(168,85,247,.35);
      border-radius:24px;
      background:rgba(15,23,42,.72);
    }

    .plan-icon{
      font-size:2rem;
      color:#a855f7;
      margin-bottom:8px;
    }

    .plan-card h2{
      margin:0 0 8px;
      font-size:2rem;
    }

    .plan-price{
      margin:0 0 18px;
      color:#a855f7;
      font-size:1.35rem;
      font-weight:800;
    }

    .plan-list{
      max-width:320px;
      margin:0 auto;
      text-align:left;
    }

    .plan-list p{
      margin:10px 0;
      color:#f8fafc;
    }

    .plan-list span{
      color:#a855f7;
      font-weight:900;
      margin-right:8px;
    }

    .upgrade-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      max-width:340px;
      min-height:58px;
      margin:24px auto 0;
      border-radius:18px;
      background:linear-gradient(
        135deg,
        #7c3aed,
        #a855f7
      );
      color:#fff;
      text-decoration:none;
      font-weight:900;
      font-size:1.05rem;
      box-shadow:0 0 20px rgba(168,85,247,.25);
    }

    .upgrade-btn:hover{
      filter:brightness(1.08);
    }

    .back-link{
      display:inline-block;
      margin-top:28px;
      color:#a855f7;
      font-weight:900;
      text-decoration:none;
    }
  </style>
</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card upgrade-card">

      <h1>
        📈 TrackWise
      </h1>

      <p class="sub">
        Choose how deep you want to track.
      </p>

      <div class="plan-card">

        <div class="plan-icon">
          ✓
        </div>

        <h2>
          Free
        </h2>

        <p class="plan-price">
          $0/month
        </p>

        <div class="plan-list">
          <p><span>✓</span>TrackWise Basics</p>
          <p><span>✓</span>Daily Check-In</p>
          <p><span>✓</span>Limited Progress Tracking</p>
        </div>

        <a
          class="upgrade-btn"
          href="/tools/trackwise/dashboard.html"
        >
          Continue Free →
        </a>

      </div>

      <div class="plan-card">

        <div class="plan-icon">
          ★
        </div>

        <h2>
          Standard
        </h2>

        <p class="plan-price">
          $6.99/month
        </p>

        <div class="plan-list">
          <p><span>✓</span>Advanced TrackWise</p>
          <p><span>✓</span>Progress Tracking</p>
          <p><span>✓</span>History & Trends</p>
          <p><span>✓</span>Extended Logs</p>
        </div>

        <a
          class="upgrade-btn"
          href="https://buy.stripe.com/test_6oUeV61fp5gz6d00Fta3u03"
          target="_blank"
        >
          Choose Standard →
        </a>

      </div>

      <a
        class="back-link"
        href="/hub/"
      >
        ← Back To FuelAI
      </a>

    </section>

  </main>

</body>
</html>
