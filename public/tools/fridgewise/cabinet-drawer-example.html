<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="icon" href="data:," />

  <title>Cabinet Drawer Example | FuelAI</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />

  <link
    rel="stylesheet"
    href="/assets/css/nav.css"
  />

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:18px;

      background:
        radial-gradient(
          circle at top,
          rgba(20,83,45,.22),
          transparent 32%
        ),
        #030712;
    }

    .example-viewer{
      width:100%;
      max-width:1100px;

      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
    }

    .example-header{
      text-align:center;
    }

    .example-header h1{
      margin:6px 0 0;

      font-size:
        clamp(1.8rem,5vw,2.7rem);
    }

    .example-header p{
      margin:8px 0 0;
      color:#94a3b8;
    }

    .example-image{
      display:block;

      max-width:100%;
      max-height:72vh;

      width:auto;
      height:auto;

      object-fit:contain;

      border-radius:20px;

      border:
        1px solid rgba(255,255,255,.08);

      box-shadow:
        0 18px 50px rgba(0,0,0,.32);
    }

    .example-actions{
      width:min(100%,360px);
    }

    .example-actions .secondary-btn{
      width:100%;
      text-align:center;
      text-decoration:none;
    }

    @media(max-width:700px){

      body{
        padding:12px;
      }

      .example-image{
        max-height:68vh;
        border-radius:16px;
      }

    }
  </style>
</head>

<body data-theme="night">

  <main class="example-viewer">

    <header class="example-header">

      <p class="range-label">
        FuelAI · Cabinet Drawer
      </p>

      <h1>
        🗄️ Your Kitchen Memory
      </h1>

      <p>
        See how Cabinet Drawer keeps your kitchen organized for FuelAI.
      </p>

    </header>

    <img
      class="example-image"
      src="/assets/img/fridgewise/cabinet-drawer-example.png"
      alt="Example of the FuelAI Cabinet Drawer"
    />

    <div class="example-actions">

      <a
        class="secondary-btn"
        href="/tools/fridgewise/cabinet-drawer.html"
      >
        ← Return to Cabinet Drawer
      </a>

    </div>

  </main>

  <script src="/assets/js/core/preferences.js"></script>
  <script src="/assets/js/core/nav.js"></script>

</body>
</html>
