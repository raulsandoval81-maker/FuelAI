<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FridgeWise Example | FuelAI</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />

  <link
    rel="stylesheet"
    href="/assets/css/nav.css"
  />

  <style>
    body{
      margin:0;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:18px;

      background:#030712;
    }

    .example-viewer{
      width:100%;
      max-width:1100px;

      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
    }

    .example-image{
      display:block;

      max-width:100%;
      max-height:78vh;

      width:auto;
      height:auto;

      object-fit:contain;

      border-radius:20px;

      border:
        1px solid rgba(255,255,255,.08);

      box-shadow:
        0 18px 50px rgba(0,0,0,.32);
    }

    .example-actions{
      width:min(100%,360px);
    }

    .example-actions .secondary-btn{
      width:100%;
    }
  </style>
</head>

<body data-theme="night">

  <main class="example-viewer">

    <img
      class="example-image"
      src="/assets/img/fridgewise/fridgewise-scan-example.png"
      alt="Example FridgeWise scan result"
    />

    <div class="example-actions">

      <a
        class="secondary-btn"
        href="/tools/fridgewise/fridgewise.html"
      >
        ← Return to FridgeWise
      </a>

    </div>

  </main>

</body>
</html>
