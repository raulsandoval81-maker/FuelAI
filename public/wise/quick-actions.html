<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Quick Actions</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <p class="range-label">
        FuelAI
      </p>

      <h1>
        ⚡ Quick Actions
      </h1>

      <p class="sub">
        Fast access when you already know what you need.
      </p>

      <div class="quick-actions-board">

        <img
          src="/assets/img/hub/QuickDashAction.png"
          alt="Quick Actions"
          class="quick-actions-image"
        />

        <a
          class="quick-hotspot quick-hotspot-fridge"
          href="/food/fridgewise.html?quick=fridge"
          aria-label="Scan Fridge"
        ></a>

        <a
          class="quick-hotspot quick-hotspot-meal"
          href="/fuel/app.html?quick=meal"
          aria-label="Scan Meal"
        ></a>

        <a
          class="quick-hotspot quick-hotspot-track"
          href="/account/macros.html"
          aria-label="Track Progress"
        ></a>

      </div>

      <div class="wise-links">

        <a
          class="secondary-btn"
          href="/hub.html"
        >
          🏠 Return to Hub
        </a>

      </div>

    </section>

  </main>

  <footer class="app-footer">

    <p>
      FuelAI • Fast help. Less overthinking.
    </p>

  </footer>

  <script src="/assets/js/core/auth-soft.js"></script>

  <script>
    window.FuelAIAuth?.requireSoftLogin();
  </script>

  <script src="/assets/js/core/preferences.js"></script>

</body>
</html>
