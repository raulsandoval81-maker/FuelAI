<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Your Team · FuelAI</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />

  <link
    rel="stylesheet"
    href="/assets/css/nav.css"
  />

  <style>

    body{
      margin:0;
      background:#071019;
      color:#fff;
    }

    .team-wrap{
      width:min(920px,calc(100% - 28px));
      margin:0 auto;
      padding:92px 0 42px;
    }

    .team-kicker{
      margin:0 0 8px;
      color:#22c55e;
      font-size:.78rem;
      font-weight:800;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    .team-title{
      margin:0;
      font-size:clamp(2rem,6vw,3.4rem);
      line-height:1;
    }

    .team-sub{
      margin:12px 0 0;
      color:#94a3b8;
      line-height:1.55;
    }

    .team-card{
      margin-top:28px;
      padding:24px;

      border:
        1px solid rgba(34,197,94,.28);

      border-radius:24px;

      background:
        linear-gradient(
          180deg,
          rgba(15,23,42,.96),
          rgba(7,16,25,.98)
        );

      box-shadow:
        0 16px 40px rgba(0,0,0,.22);
    }

    .team-card-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:18px;
    }

    .team-card h2{
      margin:0;
      font-size:1.65rem;
    }

    .team-sport{
      margin:7px 0 0;
      color:#94a3b8;
      text-transform:capitalize;
    }

    .team-status{
      padding:7px 11px;

      border-radius:999px;

      background:
        rgba(34,197,94,.12);

      border:
        1px solid rgba(34,197,94,.28);

      color:#86efac;

      font-size:.76rem;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .team-grid{
      display:grid;
      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:12px;
      margin-top:22px;
    }

    .team-stat{
      padding:16px;

      border-radius:17px;

      border:
        1px solid rgba(255,255,255,.07);

      background:
        rgba(255,255,255,.025);
    }

    .team-stat span{
      display:block;

      color:#64748b;

      font-size:.72rem;
      font-weight:800;
      letter-spacing:.1em;
      text-transform:uppercase;
    }

    .team-stat strong{
      display:block;
      margin-top:6px;
      font-size:1.05rem;
      text-transform:capitalize;
    }

    .team-empty{
      display:none;

      margin-top:28px;
      padding:24px;

      border-radius:22px;

      border:
        1px solid rgba(255,255,255,.08);

      background:
        rgba(15,23,42,.78);

      color:#cbd5e1;
      line-height:1.55;
    }

    .team-footer{
      margin-top:30px;

      text-align:center;

      color:#64748b;

      font-size:.78rem;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .team-footer strong{
      color:#22c55e;
    }

    @media (max-width:560px){

      .team-grid{
        grid-template-columns:1fr;
      }

      .team-card-head{
        flex-direction:column;
      }

    }

  </style>

</head>

<body data-theme="night">

  <main class="team-wrap">

    <p class="team-kicker">
      FuelAI Team
    </p>

    <h1 class="team-title">
      Your Team
    </h1>

    <p class="team-sub">
      Your active FuelAI team membership.
    </p>


    <section
      id="teamCard"
      class="team-card"
      style="display:none;"
    >

      <div class="team-card-head">

        <div>

          <h2 id="teamName">
            Team
          </h2>

          <p
            id="teamSport"
            class="team-sport"
          >
            Team
          </p>

        </div>

        <div
          id="teamStatus"
          class="team-status"
        >
          Active
        </div>

      </div>


      <div class="team-grid">

        <div class="team-stat">

          <span>
            Your Role
          </span>

          <strong id="teamRole">
            —
          </strong>

        </div>


        <div class="team-stat">

          <span>
            Membership
          </span>

          <strong id="teamMembership">
            —
          </strong>

        </div>

      </div>

    </section>


    <section
      id="teamEmpty"
      class="team-empty"
    >
      No active FuelAI team membership was found for this account.
    </section>


    <footer class="team-footer">
      FuelAI™ · Powered by
      <strong>Sandman™</strong>
    </footer>

  </main>


  <script src="/assets/js/core/plan.js?v=beta3"></script>

  <script
    type="module"
    src="/assets/js/core/firebase.js?v=1"
  ></script>

  <script src="/assets/js/core/auth-soft.js"></script>

  <script src="/assets/js/core/identity.js?v=identity1"></script>


  <script>

    window.FuelAIAuth
      ?.requireSoftLogin();


    const memberships =
      window.FuelAIIdentity
        ?.getFuelAITeamMemberships?.() ||
      [];


    const membership =
      memberships.find(
        item =>
          item.status ===
          "active"
      );


    const teamCard =
      document.getElementById(
        "teamCard"
      );


    const teamEmpty =
      document.getElementById(
        "teamEmpty"
      );


    if (membership) {

      teamCard.style.display =
        "";


      document.getElementById(
        "teamName"
      ).textContent =
        membership.teamName ||
        membership.teamId ||
        "FuelAI Team";


      document.getElementById(
        "teamSport"
      ).textContent =
        membership.sport ||
        "Team Membership";


      document.getElementById(
        "teamRole"
      ).textContent =
        membership.role ||
        "member";


      document.getElementById(
        "teamMembership"
      ).textContent =
        membership.status ||
        "active";


      document.getElementById(
        "teamStatus"
      ).textContent =
        membership.status ||
        "active";

    } else {

      teamEmpty.style.display =
        "block";

    }

  </script>


  <script src="/assets/js/core/nav.js?v=team1"></script>

</body>
</html>
