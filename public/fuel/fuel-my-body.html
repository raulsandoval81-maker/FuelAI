<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Fuel My Body</title>

  <link
    rel="stylesheet"
    href="/public/assets/css/site.css"
  />

  <link
    rel="stylesheet"
    href="/public/assets/css/hub-screen.css"
  />

</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <div class="hub-screen fuel-map">

        <img
          class="hub-screen-img"
          src="/public/assets/img/hub/fuel-my-body2.png"
          alt="Fuel House"
        />

        <a
          class="hub-hotspot one"
          href="/public/fuel/app.html"
          aria-label="Scan Meal"
        ></a>

        <a
          class="hub-hotspot two"
          href="/public/account/macros.html"
          aria-label="Macro Tracking"
        ></a>

        <a
          class="hub-hotspot three"
          href="/public/fuel/recovery.html"
          aria-label="Recovery"
        ></a>

        <a
          class="hub-hotspot four"
          href="/public/account/profile.html"
          aria-label="Profile"
        ></a>

      </div>

      <p class="hero-note">
        FuelAI • Less overthinking. Better decisions.
      </p>

    </section>

  </main>

  <footer class="app-footer">

    <p>
      FuelAI • Fuel and recovery center.
    </p>

  </footer>

</body>
</html>
