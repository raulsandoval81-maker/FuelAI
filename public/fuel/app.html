<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="icon" href="data:," />

  <title>FuelWise Scanner</title>

  <link
    rel="stylesheet"
    href="/assets/css/site.css"
  />
</head>

<body data-theme="night">

  <main class="scan-wrap">

    <section class="scan-card">

      <p class="range-label">
        FuelAI
      </p>

      <h1>
        FuelWise
      </h1>

      <p class="sub">
        Scan a meal. Log water. Keep it simple.
      </p>

      <div
        id="uploadBox"
        class="upload-actions"
      >

        <label class="upload-half">

          <span class="upload-title">
            📸 Take Photo
          </span>

          <span class="upload-sub">
            Open camera
          </span>

          <input
            id="foodInput"
            type="file"
            accept="image/*"
            capture="environment"
          />

        </label>

        <label class="upload-half">

          <span class="upload-title">
            🖼️ Upload Photo
          </span>

          <span class="upload-sub">
            Choose from library
          </span>

          <input
            id="foodUploadInput"
            type="file"
            accept="image/*"
          />

        </label>

      </div>

      <section class="range-card">

        <p class="range-label">
          Quick Action
        </p>

        <button
          id="addWaterBtn"
          class="secondary-btn"
          type="button"
        >
          💧 + 8 oz Water
        </button>

      </section>

      <textarea
        id="extraIngredients"
        class="goal-select"
        placeholder="Anything else in this meal? Oil, sauce, cheese, dressing..."
        rows="3"
      ></textarea>

      <img
        id="previewImage"
        class="preview hidden"
        alt="Food preview"
      />

      <button
        id="analyzeBtn"
        class="start-btn hidden"
        type="button"
      >
        🔍 Scan Meal
      </button>

      <div
        id="loadingCard"
        class="loading-card hidden"
      >

        <div class="scanner"></div>

        <p id="loadingText">
          Loading...
        </p>

      </div>

      <section
        id="resultCard"
        class="result-card hidden"
      ></section>

      <div class="wise-links">

        <a
          class="secondary-btn"
          href="/hub.html"
        >
          🏠 Return to Hub
        </a>

      </div>

    </section>

  </main>

  <footer class="app-footer">

    <p>
      FuelAI • Less overthinking. Better decisions.
    </p>

  </footer>

  <script src="/assets/js/core/auth-soft.js"></script>

  <script>
    window.FuelAIAuth?.requireSoftLogin();
  </script>

  <script src="/assets/js/core/preferences.js"></script>
  <script src="/assets/js/account/fuelai-log.js"></script>
  <script src="/assets/js/fuel/app.js"></script>

</body>
</html>
